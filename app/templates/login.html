{% extends "auth_base.html" %}
{% block auth_title %}Connexion{% endblock %}
{% block auth_content %}
<div class="auth-heading">
  <div class="brand"><span class="brand-mark">J</span><span><strong>Jev</strong><small>Accès protégé</small></span></div>
  <h1>Connexion</h1>
  <p class="muted">Connectez-vous avec votre email ou nom d'utilisateur.</p>
</div>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="/login" class="stack-form">
  <input type="hidden" name="next" value="{{ next }}">
  <label for="identifier">Email ou nom d'utilisateur</label>
  <input id="identifier" name="identifier" type="text" autocomplete="username" required autofocus>
  <label for="password">Mot de passe</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button class="primary-btn" type="submit">Se connecter</button>
</form>
{% endblock %}
