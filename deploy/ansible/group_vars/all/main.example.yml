---
# Copier vers group_vars/all/main.yml et adapter.
jev_version: "2.4.3"
jev_domain: "jev.example.com"
jev_acme_email: "admin@example.com"
jev_timezone: "Europe/Paris"

jev_admin_username: "admin"
jev_admin_email: "admin@example.com"

jev_backup_schedule: "*-*-* 03:15:00"
jev_backup_retention_days: 14

# Désactivé par défaut pour ne jamais couper un accès SSH non standard.
jev_manage_firewall: false
jev_ssh_port: 22

# L’archive du tag GitHub est utilisée par défaut. Cette valeur peut pointer
# vers un miroir ou une archive interne.
# jev_release_url: "https://github.com/Advil400mg/job_eval/archive/refs/tags/v2.4.3.tar.gz"
